<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="How I document my AI-first workflow in every public repo — cover image for the Dev.to write-up">
  <defs>
    <linearGradient id="devbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D9E75"/>
      <stop offset="1" stop-color="#5DCAA5"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="420" fill="url(#devbg)"/>

  <!-- corner glows -->
  <circle cx="900" cy="60" r="200" fill="#1D9E75" opacity="0.10"/>
  <circle cx="60" cy="380" r="240" fill="#7F77DD" opacity="0.08"/>

  <!-- Left column: title + tagline -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#241f4a" stroke="#3d3670"/>
    <text x="90" y="20" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" letter-spacing="0.10em">DEV.TO · GRONSKIDEVELOPER</text>

    <text x="0" y="90" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#ffffff" font-weight="800" letter-spacing="-0.02em">How I document my</text>
    <text x="0" y="138" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#ffffff" font-weight="800" letter-spacing="-0.02em">AI-first workflow</text>
    <text x="0" y="180" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.75" font-style="italic">in every public repo</text>

    <text x="0" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.60">A concrete workflow, not a manifesto.</text>
    <text x="0" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.60">Five working repos as reference.</text>
  </g>

  <!-- Right column: file-tree mockup showing the three artifacts -->
  <g transform="translate(560, 100)" font-family="'Courier New', Courier, monospace" font-size="13">
    <rect x="0" y="0" width="380" height="240" rx="12" fill="#0a0820" stroke="#302a5c"/>

    <!-- fake window controls -->
    <circle cx="18" cy="18" r="5" fill="#E53E3E" opacity="0.6"/>
    <circle cx="34" cy="18" r="5" fill="#EF9F27" opacity="0.6"/>
    <circle cx="50" cy="18" r="5" fill="#5DCAA5" opacity="0.6"/>
    <text x="200" y="22" fill="#ffffff" fill-opacity="0.35" font-size="10" text-anchor="middle">📁 my-repo</text>

    <!-- file tree -->
    <g transform="translate(24, 56)" fill="#ffffff" fill-opacity="0.75">
      <text y="0">📄 README.md</text>
      <text y="26" fill="#5DCAA5" font-weight="700">📄 CLAUDE.md            ← who did what</text>
      <text y="52" fill="#5DCAA5" font-weight="700">📄 CASE_STUDY.md        ← retro of a build</text>
      <text y="78">📁 .claude/</text>
      <text y="98" x="16" fill="#5DCAA5" font-weight="700">📁 commands/          ← agent config</text>
      <text y="118" x="32">📄 security-review.md</text>
      <text y="144">📄 SECURITY.md</text>
      <text y="164">📄 CONTRIBUTING.md</text>
      <text y="184">📁 src/</text>
    </g>
  </g>

  <!-- Footer: author + tags -->
  <g transform="translate(60, 360)">
    <circle cx="18" cy="18" r="18" fill="url(#chip)"/>
    <text x="18" y="24" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f0c29" font-weight="800" text-anchor="middle">D</text>
    <text x="52" y="16" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff" font-weight="600">Dominik Groński · GroDev</text>
    <text x="52" y="34" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffffff" fill-opacity="0.55">github.com/GronskiDeveloper · grodev.pl</text>
  </g>

  <g transform="translate(700, 372)" font-family="'Courier New', Courier, monospace" font-size="11">
    <rect x="0" y="0" width="52" height="24" rx="12" fill="#2a2555"/>
    <text x="26" y="16" fill="#ffffff" fill-opacity="0.70" text-anchor="middle">#aifirst</text>
    <rect x="62" y="0" width="52" height="24" rx="12" fill="#2a2555"/>
    <text x="88" y="16" fill="#ffffff" fill-opacity="0.70" text-anchor="middle">#claude</text>
    <rect x="124" y="0" width="66" height="24" rx="12" fill="#2a2555"/>
    <text x="157" y="16" fill="#ffffff" fill-opacity="0.70" text-anchor="middle">#workflow</text>
    <rect x="200" y="0" width="80" height="24" rx="12" fill="#2a2555"/>
    <text x="240" y="16" fill="#ffffff" fill-opacity="0.70" text-anchor="middle">#opensource</text>
  </g>
</svg>
